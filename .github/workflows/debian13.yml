name: Debian 13 for Xiaomi Pad 6 Pro

on:
  workflow_dispatch:
    inputs:
      build_boot:
        description: "Also assemble boot.img (needs the 6.7 GB stock fastboot ROM)"
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/**"
      - "ci/**"

concurrency:
  group: debian13-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  UPSTREAM: https://github.com/yzddmr6/xiaomipad-6pro-mainline.git

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Host dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross binutils-aarch64-linux-gnu \
            python3 git ccache kmod rsync libdrm-dev zstd cpio
      - name: Checkout upstream project
        run: |
          git clone --depth 1 "$UPSTREAM" project
          for p in patches/*.patch; do git -C project apply "$PWD/$p"; done
          git -C project rev-parse HEAD
      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-kernel-${{ hashFiles('patches/**', 'ci/**') }}
          restore-keys: ccache-kernel-
      - name: Build kernel
        run: |
          bash ci/build-kernel.sh
      - name: Collect
        run: |
          mkdir -p dist
          tar -C kernel-out -cf - . | zstd -3 -T0 -o dist/kernel-out.tar.zst
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-out
          path: dist/kernel-out.tar.zst
          compression-level: 0
          retention-days: 7

  rootfs:
    needs: kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Host dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mmdebstrap qemu-user-static binfmt-support \
            debian-archive-keyring zstd cpio
          sudo update-binfmts --enable qemu-aarch64
          ls /proc/sys/fs/binfmt_misc/ | grep -i aarch64
      - name: Checkout upstream project
        run: |
          git clone --depth 1 "$UPSTREAM" project
          for p in patches/*.patch; do git -C project apply "$PWD/$p"; done
      - uses: actions/download-artifact@v4
        with:
          name: kernel-out
          path: .
      - name: Unpack kernel
        run: |
          mkdir kernel-out
          zstd -d -c kernel-out.tar.zst | tar -C kernel-out -xf -
          ls kernel-out/arch/arm64/boot/
      - name: Build Debian 13 rootfs
        run: |
          sudo -E bash ci/build-rootfs.sh
      - name: Collect
        run: |
          mkdir -p dist
          cp rootfs.tar.gz dist/
          cat kernel-out/include/config/kernel.release > dist/kernel.release
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: rootfs
          path: dist/*
          compression-level: 0
          retention-days: 7

  boot:
    needs: [kernel, rootfs]
    if: github.event.inputs.build_boot == 'true' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Host dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            python3 git m4 alsa-utils lz4 zstd cpio file zstd libdrm-dev
      - name: Checkout upstream project
        run: |
          git clone --depth 1 "$UPSTREAM" project
          for p in patches/*.patch; do git -C project apply "$PWD/$p"; done
      - name: Checkout pinned kernel source
        run: |
          commit=$(python3 -c "import json;print(json.load(open('project/kernel/source.json'))['commit'])")
          branch=$(python3 -c "import json;print(json.load(open('project/kernel/source.json'))['branch'])")
          repo=$(python3 -c "import json;print(json.load(open('project/kernel/source.json'))['repo'])")
          git clone --depth 1 --branch "$branch" "$repo" linux-sm8450-liuqin
          git -C linux-sm8450-liuqin fetch --depth 1 origin "$commit"
          git -C linux-sm8450-liuqin checkout -q "$commit"
          git -C linux-sm8450-liuqin rev-parse HEAD
      - uses: actions/download-artifact@v4
        with:
          name: kernel-out
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: rootfs
          path: .
      - name: Unpack inputs
        run: |
          mkdir -p kernel-out
          zstd -d -c kernel-out.tar.zst | tar -C kernel-out -xf -
          ls kernel-out/arch/arm64/boot/Image rootfs.tar.gz
      - name: Assemble boot.img
        run: |
          bash ci/build-boot.sh
      - name: Collect
        run: |
          mkdir -p dist
          cp project/out/native-boot/boot-liuqin-native.img dist/boot.img
          cp project/out/native-boot/native-boot.identity dist/native-boot.identity
          cat kernel-out/include/config/kernel.release > dist/kernel.release
          sha256sum dist/* || true
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: boot
          path: dist/*
          compression-level: 0
          retention-days: 7

  release:
    needs: [kernel, rootfs, boot]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: boot
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: rootfs
          path: dist
      - name: Checksums
        run: |
          cd dist
          sha256sum boot.img rootfs.tar.gz kernel.release > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/boot.img
            dist/rootfs.tar.gz
            dist/kernel.release
            dist/SHA256SUMS
            dist/native-boot.identity

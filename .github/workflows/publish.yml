name: publish release

# Assemble a release straight from the artifacts of earlier runs, so the
# ~70 MB boot image and the 553 MB rootfs never have to travel through the
# machine that dispatched the build.
on:
  workflow_dispatch:
    inputs:
      boot_run:
        description: "run id carrying the boot artifact"
        required: true
        type: string
      rootfs_run:
        description: "run id carrying the rootfs + kernel-out artifacts"
        required: true
        type: string
      tag:
        description: "release tag"
        required: true
        default: "v0.1.0-debian13"
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: boot
          run-id: ${{ inputs.boot_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: rootfs
          run-id: ${{ inputs.rootfs_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist
      - name: Verify the boot image shape
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq device-tree-compiler python3
          python3 - <<'PYVERIFY'
          import struct, subprocess
          data = open('dist/boot.img', 'rb').read()
          assert data[:8] == b'ANDROID!', 'not an Android boot image'
          (kernel_size, kernel_addr, ramdisk_size, ramdisk_addr, second_size,
           second_addr, tags_addr, page_size, header_version) = struct.unpack_from('<9I', data, 8)
          print(f'boot.img: {len(data)} bytes, header v{header_version}, page {page_size}')
          print(f'  kernel {kernel_size} @ {kernel_addr:#x}')
          print(f'  ramdisk {ramdisk_size} @ {ramdisk_addr:#x}')
          kernel_gz = data[page_size:page_size + kernel_size]
          ramdisk_off = page_size + (kernel_size + page_size - 1) // page_size * page_size
          ramdisk = data[ramdisk_off:ramdisk_off + ramdisk_size]
          open('/tmp/Image.gz', 'wb').write(kernel_gz)
          open('/tmp/ramdisk.gz', 'wb').write(ramdisk)
          print('  Image.gz magic', kernel_gz[:2].hex(), ' ramdisk magic', ramdisk[:2].hex())
          # The device tree follows the ramdisk; ABL applies its stock overlay to
          # it, so it must still carry the exported symbol table.
          dtb_at = data.find(b'\xd0\x0d\xfe\xed', ramdisk_off + ramdisk_size)
          print('  dtb at', dtb_at)
          if dtb_at >= 0:
              open('/tmp/boot.dtb', 'wb').write(data[dtb_at:])
              dts = subprocess.run(['dtc', '-I', 'dtb', '-O', 'dts', '/tmp/boot.dtb'],
                                   capture_output=True, text=True)
              if dts.returncode == 0:
                  text = dts.stdout
                  print('  __symbols__ node:', text.count('__symbols__'))
                  print('  model:', [l for l in text.splitlines() if 'model =' in l][:1])
              else:
                  print('  dtc failed:', dts.stderr[:200])
          PYVERIFY
          mkdir -p /tmp/rd && cd /tmp/rd && gzip -dc /tmp/ramdisk.gz | cpio -idm --quiet
          ls -l /tmp/rd/init /tmp/rd/bin/busybox /tmp/rd/etc/liuqin-storage-mode /tmp/rd/etc/liuqin-root-profile
          cat /tmp/rd/etc/liuqin-storage-mode /tmp/rd/etc/liuqin-root-profile
          head -3 /tmp/rd/etc/liuqin-native-root.contract
      - name: Checksums
        run: |
          cd dist
          sha256sum boot.img rootfs.tar.gz kernel.release > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Debian 13 for Xiaomi Pad 6 Pro ${{ inputs.tag }}
          body: |
            Debian 13 (trixie) rootfs + mainline kernel + boot.img for Xiaomi Pad 6 Pro (liuqin).

            Built by `.github/workflows/debian13.yml` from the pinned kernel commit
            and the upstream project's BUILD.md pipeline, with denial as the desktop.

            See the repository README for install steps and known limits.
            Built artifacts are not device-tested.
          files: |
            dist/boot.img
            dist/rootfs.tar.gz
            dist/kernel.release
            dist/SHA256SUMS
            dist/native-boot.identity
